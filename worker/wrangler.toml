name = "retro-cofre"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Namespace criado com: npx wrangler kv namespace create RETROS
# (o wrangler dev --local usa uma cópia simulada, sem tocar no de verdade)
[[kv_namespaces]]
binding = "RETROS"
id = "a871451101f34240ab374b86d5c20f77"

# No máximo 3 links por minuto por endereço de internet
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

[vars]
ALLOWED_ORIGINS = "https://carlosrrocha003.github.io,http://localhost:5199,http://localhost:5173"
